package_base=com.crh.logon.persistence
db.type=oracle
# we're using hibernate as a default. other supported driver: openjpa
jpadriver=hibernate
db.aid=LGN
#persistenceunit_name is used by oradbdiff 
persistenceunit_name=logon-test

# Required for setting ctl_cre_uid and ctl_mod_uid,
# so that it works for both string and numeric user ID types
# In Logon the user ID type is numeric.
useridtype=DECIMAL
useridsize=12

db.role.app=rl_lgn_user
db.tablespace.index=INDEX_LGN_A

entities_generics=yes

#-- u = useradmin
#-- a = common (allgemein)
#-- r = ref data
#-- s = SAP (evtl)
TLGNU=admin
TLGNC=common
TLGNR=refdata
TLGNS=sap
TLGNF=frozen
TLGNM=monitoring
TLGNT=tablebrowser
TGDIA=test

# how we map the db types to java types...
VARCHAR(*)=String
DECIMAL(*)=Long
DECIMAL(*,*)=java.math.BigDecimal
DOUBLE=Double
TIMESTAMP=Date
DATE=Date
BLOB=byte []
BOOLEAN=Boolean

# relationships
#WARNING!!! at some places BeanUtils.cloneBean is used, it is not copying these lists, that has to be done manually!!!!!
ShiptoEntity+ShiptoSiloEntity=OneToMany | field=silos
ShiptoEntity+ShiptoPersonEntity=OneToMany | field=shiptoPersonList
ShiptoSareaEntity+ShiptoSareaRestrEntity=OneToMany | field=restrictions
ShiptoSareaEntity+ShiptoBilltoEntity=OneToMany | field=billtos

LoadingpointEntity+LdpointMatRestrEntity=OneToMany | field=matRestrictions
RfidobjectEntity+RfidtagEntity=OneToMany | field=rfids
SapMaterialEntity+SapMaterialPlantEntity=OneToMany | field=plants
#SapMaterialEntity+SapMaterialDescriptionEntity=OneToMany | field=descriptions
AssignmentEntity+AssignmentPartEntity=OneToMany | field=assignmentParts
ShiptoSareaRestrEntity+ShiptoSareaRestrBtrulEntity=OneToMany | field=rules
#ShiptoVkoRestrBulkprdEntity+ShiptoVkoRestrBtRuleEntity=OneToMany | field=rules
ShiptoSareaRestrEntity+ShsareaRestrTruckTypeEntity=OneToMany | field=restrTruckTypes
#ShiptoVkoRestrBulkprdEntity+SapMaterialDescriptionEntity=OneToMany | field=materialDesc |

PoolEntity+CarrierEntity=ManyToMany | jointable=tlgnc_pool_carrier | joinColumns=POOL_ID | inverseJoinColumns=CARRIER_ID
SareaEntity+PlantSareaEntity=OneToMany | field=plantSareaEntities
#ShiptoEntity+UserEntity=ManyToMany | jointable=tlgnu_user_shipto_acc | joinColumns=SAP_SHIPTO_ID | inverseJoinColumns=USER_ID
# m-n relationships look like this:
# ShiptoEntity+HaendlerEntity=ManyToMany | jointable=SHIPTO_HAENDLER | joinColumns=SHIPTO_ID | inverseJoinColumns=HAENDLER_ID | orderby=id

OrderEntity+OrderItemEntity=OneToMany | field=orderItems
OrderEntity+OrderTruckTypeEntity=OneToMany | field=orderVehicleTypes
OrderFinalEntity+OrderItemFinalEntity=OneToMany | field=orderFinalItems
OrderRepEntity+OrderRepMaintTypeEntity=OneToMany | field=orderRepMaintTypes
OrderRepEntity+OrderRepAttEntity=OneToMany | field=orderRepAttachments
OrderRepEntity+OrderRepDmgcodeTypeEntity=OneToMany | field=damageCdList

WagonEntity+WagonDmgcodeTypeEntity=OneToMany | field=damageCdList
WagonEntity+WagonRepAttEntity=OneToMany | field=wagonRepAttachments

CustorderEntity+CustorderItemEntity=OneToMany | field=custorderItems
CustorderEntity+OrderEntity=OneToMany | field=orders
SapContractEntity+SapContractItemEntity=OneToMany | field=sapContractItems

MaintRhythmEntity+MaintRhythmDependEntity=OneToMany | field=dependencies

SapMaterialPkgMapRuleEntity+SapMaterialPkgMapConditionEntity=OneToMany | field=conditions

# name mappings for objects which have too long a name
#VLGNR_DELIV_NOTE_PRINT_TYPE_TEXT=VLGNR_DELV_NOTE_PRNT_TYPE_TEXT

