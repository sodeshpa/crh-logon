###########################################
###  DB parameters for db-* ant targets ###
###########################################

# E.g. test DB recreation with db-coldstart

# Standard owner/user on all AdN instances.
db.connection.username=ulgn02
db.connection.password=ulgn02
db.connection.loginmodule_username=ulgn03
db.connection.loginmodule_password=ulgn03
db.connection.schema_owner=ulgn01
db.connection.schema_owner_pwd=ulgn01
db.connection.schema_owner.to.use.from.local=true
sapdb.connection.username=ulgnsap
sapdb.connection.password=ulgnsap

# aal oracle script properties
db.aid=lgn_a
db.connection.host=oravmlhu01.bp.adnovum.hu
db.connection.port=49500
# remove the star at the end if you know, what you are doing
db.connection.db_name=DHUCLG00*
db.user.root_username=system
db.user.root_password=managed
db.user.adm_username=${db.connection.schema_owner}
db.user.adm_password=${db.connection.schema_owner_pwd}
db.user.app_username=${db.connection.username}
db.user.app_password=${db.connection.password}
db.user.sap_username=${sapdb.connection.username}
db.user.sap_password=${sapdb.connection.password}
db.role.app=rl_lgn_user
db.role.adm=rl_lgn_owner

db.run.dir=${masterbuild.dir}/build/sql
db.spool.dir=${db.run.dir}
db.log.dir=${db.run.dir}/log
db.drop_user.sql=${db.run.dir}/admin/drop_user.sql
db-drop.allow=true
db.create_user.sql=${db.run.dir}/user.sql

resources.encoding=UTF-8

