# Do all caching and dev installation on LDT local disk (NFS server thanks you)
LOCAL_DIR=/local/${user.name}

# Disable dependency publish to Appweb3 central webservice for DEV environment
appweb3.publish.skip=true

#We use two different server, one for the application and one for seleniumtests/mockups
selenium.server.host=localhost
application.test.host=localhost
password.strength.validation.enabled=false

# during development we don't want to recreate the documentation every time
DONT_BUILD_DOCS=true

# uncomment to deploy exploded: this is really cool for development
# deployment.exploded=true

# an external file for the application to read some configuration...
configurationPath=etc/logon-dev.properties

# the external log4j config file path
externalLog4jConfigPath=etc/log4j_dev.xml

# should be remote if you want to test the service from a remote client
# (e.g. the test-unit in logon-business)
deployment=remote

pkg.dest.dir=build/pkg
PKG_DEST=build/pkg

# Setup for Developers with form based auth and LogonDev Module
login.domain.int=LogonDevDomain
login.config.int=<login-config><auth-method>FORM</auth-method><form-login-config><form-login-page>/Login.jsp</form-login-page><form-error-page>/Error.jsp</form-error-page></form-login-config></login-config>

# set to 'true' and requests to http:// will be redirected to https://
redirect_to_https.ext=false
redirect_to_https.dmz=false
redirect_to_https.terminal=false
redirect_to_https.int=false

# Default port for webapp
jboss.bind.webport=15080
jboss.bind.ejbport=3873
jboss.bind.wsport=15080
jboss.ssl.bind.webport=8443
jboss.ssl.bind.ejbport=3843
jboss.ssl.bind.wsport=15080
#jboss.ssl.keystore.file=/home/<CONFIGURE-PATH-TO-YOUR>/logon.keystore
#jboss.ssl.keystore.pass=<YOUR_PASSPHRASE>
#jboss.ssl.truststore.file=/home/<CONFIGURE-PATH-TO-YOUR>/logon.truststore
#jboss.ssl.truststore.pass=<YOUR_PASSPHRASE>

#AXIS2 specific settings
AXIS2_ADMIN_UID=axis2
AXIS2_ADMIN_PWD=axis2

# Webservices - host
webservices.host.url=http://${application.test.host}:15080

