#---------------------------------------------------------------------------------------
# Local devenv drive contains cached resources when using maven dependencies
# and when going offline (aal-bootstrap.environment-local). 
# For production settings, we want everything withing the checked-out project.
# Usage of the local stuff:
# * LOCAL_DIR:           Caches (prod,nightly: ${topbuild.dir}; dev: /local/${user.name})
# * CONTAINER_DIR_LOCAL: Used by aal-container-* (container-* targets)
# * EXT_PROJ_DIR_LOCAL:  Used by aal-bootstrap (environment-local target)
# * MPOSITORY_DIR_LOCAL: Used by aal-maven (M2_REPO support in settings.xml)
# * JAVA_HOME_LOCAL:     Used by aal-bootstrap (environment-local target)
# * PROJECT_DIR_LOCAL:   FYI only
# * ECLIPSE_DIR_LOCAL:   FYI only 
#---------------------------------------------------------------------------------------
LOCAL_DIR=${basedir}/..
CONTAINER_DIR_LOCAL=${LOCAL_DIR}/container
EXT_PROJ_DIR_LOCAL=${LOCAL_DIR}/jpository
MPOSITORY_DIR_LOCAL=${LOCAL_DIR}/mpository
JAVA_HOME_LOCAL=${LOCAL_DIR}/java/jdk
#PROJECT_DIR_LOCAL=${LOCAL_DIR}/projects
#ECLIPSE_DIR_LOCAL=${LOCAL_DIR}/eclipse

# the following value will show up as the X-Powered-By HTTP header in server responses
X-Powered-By=h-peas (crh Pegasus Enterprise Application Server)

# packaging properties
pkg.dest.dir=/share/pkg/${project}/${version}
rpm.arch=i586
rpm.source.dir=/usr/src/packages/SOURCES
rpm.rpms.dir=/usr/src/packages/RPMS/${rpm.arch}

ADNPKG_HOME=/share/install/adnpkg/1.5.1.1/adnpkg
PKG_DEST=/share/pkg/

PKG_WIN_INSTALL_DIR=D:\\AdNovum\\

#DB scripts for logondb pkg
