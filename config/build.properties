SERVICE_HOME=${EXT_PROJ_DIR}/jboss/jboss-web-native/2.0.6-win32/dist-bin

# Security domain (SPNEGO for Kerberos, DevDomain for development with Username / Password)
login.domain.int=SPNEGO
login.domain.ext=LogonDmzDomain
login.domain.dmz=LogonDmzDomain
login.domain.terminal=LogonTerminalDomain
login.config.int=<login-config><auth-method>SPNEGO</auth-method><realm-name>SPNEGO</realm-name></login-config>
login.config.ext=<login-config><auth-method>FORM</auth-method><form-login-config><form-login-page>/Login.jsp</form-login-page><form-error-page>/Error.jsp</form-error-page></form-login-config></login-config>
login.config.dmz=<login-config><auth-method>FORM</auth-method><form-login-config><form-login-page>/Login.jsp</form-login-page><form-error-page>/Error.jsp</form-error-page></form-login-config></login-config>
login.config.terminal=<login-config><auth-method>FORM</auth-method><form-login-config><form-login-page>/TerminalLogin.jsp</form-login-page><form-error-page>/TerminalError.jsp</form-error-page></form-login-config></login-config>

# set to 'true' and requests to http:// will be redirected to https://
# 2014-12-09/maag: crh proxy translates https to http, so enabling https redirection leads to an infinite loop
redirect_to_https.ext=false
redirect_to_https.dmz=true
redirect_to_https.terminal=false
redirect_to_https.int=false

