# Webservices  - mockup service e-mail configuration
#
# If e-mail is enabled, the mockup services for SMS and fax send
# confirmation e-mails containing the SMS or fax contents to the
# user, or to the specified e-mail address, using the specified
# SMTP mail host. The mail host defaults to: smtp-dev.adnvoum.ch
# The e-mail addresses of both the sender and recipient must be
# in the adnovum.ch domain. The sender addresses are hard-coded
# in the mock services. The recipient address can be configured.
# If not specified, the recipient is: ${USER}@adnovum.ch, namely
# whichever developer is running the mock services.
#
mockup.email.enabled=false
mockup.email.recipient=
mockup.email.smtp.host=smtp-dev.adnovum.ch

# LOGON host url (mop simulator and mockup send messages to this host url)
ws.logon.mopevent.consumer.host=http://${application.test.host}
ws.logon.mopevent.consumer.port=15080
ws.logon.mopevent.consumer.context=/logon/webservices-mop-incoming/services/MOPEventConsumer
ws.logon.mopevent.consumer.url=${ws.logon.mopevent.consumer.host}:${ws.logon.mopevent.consumer.port}${ws.logon.mopevent.consumer.context}
ws.logon.ldsevent.consumer.host=http://${application.test.host}
ws.logon.ldsevent.consumer.port=15080
ws.logon.ldsevent.consumer.context=/logon/webservices-pws-incoming/services/LogonLDSInterface
ws.logon.ldsevent.consumer.url=${ws.logon.ldsevent.consumer.host}:${ws.logon.ldsevent.consumer.port}${ws.logon.ldsevent.consumer.context}


# set to true to disable sending of HTTP Expires/Cache-control headers
#client.caching.disabled=true

# uncomment to disable minifying javascript
#minifyjs.disabled=true

jmx.admin.username=jmxadmin
jmx.admin.password=jmxadmin

# Driver timeout for implicit waits (e.g. loading of a page) especially for NB (because of performance issue in NB environment)
selenium.timeout=300

#driver version set to 0.30 when on the NB project server FF version is 78.14.0esr
geckodriver.enabled=true
geckodriver.version=0.30.0

application.test.url=http://logonadmin:logonadmin@${application.test.host}:15080
# LOGON-8695: Wait max 1h for container port to be available during NB.
container.shutdown.wait=3600

# Setting debug options intentionally empty for the NB - we don't need debug there
container.jvm.debug.options=

# The Sonar task should fail if the quality gate is broken
sonar.buildbreaker.skip=false
