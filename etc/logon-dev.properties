# Note: when modifying this file, please check etc/logon-nightly as well.

# the application will start up with the instance specified here.
# it can be changed at runtime using the versionCheck servlet
# this value specifies what instance-values will be read from the
# tlgnr_config table
# important: this is a SYSTEM WIDE property. each participating
# member of the system will be served the configuration of the
# same instance

# the instance can accept exactly one parameter, marked as %s
# (see String.format). It will be replaced by the system property
# "user.name" at runtime, which is the user's name who launched
# the JVM running the container.
instance=adnovum.dev.%s

# the servicelocator will use the address specified here to do 
# the service lookups
#providerurl=jnp://localhost:1099
#providerurl=jnp://192.168.12.59:1099
providerurl=remote://localhost:4447

# devmode must be false in production. if set to false, the following
# additional checks are done:
#     - enforce that all configuration values are in the DB (TLGNR_CONFIG)
#     - check availability of all tables known to the application (mapping files)
#     - check that all access restrictions are working
# -> the app will not start if any of these checks fail when devmode=false
devmode=true

# If 'exec_authorize_insurance' is set to true, a check is performed
# that all access restrictions are working.
# - Package configuration: It is important that at least one server in a
#   cluster (typically the logonLAN/internal users) have this set to true,
#   in order to detect errors in the DAOs which may lead to authorization
#   security breaches.
# - Dev config: Normally set to false (quicker startup, less bogus errors
#   due to temporary inconsistencies between DB and code). Set to 'true'
#   when verifying a fresh DB setup.
# If this setting causes startup failures: analyse the root-cause, but
# otherwise it may be OK to disable check TEMPORARILY in QUALITY and
# INTEGRATION environments.
# Do NOT permanently disable this in production environments!
exec_authorize_insurance=false

# either 'int', 'ext' or 'dmz':
# - int: internal users, i.e. tablebrowser is active
# - ext: external users, tablebrowser deactivated
# - dmz: no longer used (until LOGON 1.6)
zone=int

# acces restrictions can be disabled here. this is a last resort
# fallback possibility in case sth completely unforeseen goes wrong
# with authorization. If set to false, you will see a lot of errors
# in the log.
access_restrictions=true

#----------------------------------------------------------
# scheduled services
#----------------------------------------------------------
# fields:
#     seconds minute hour day month week
# values:
#     Field Name     Allowed Values             Allowed Special Characters
#     Seconds           0-59                          , - * /
#     Minutes           0-59                          , - * /
#     Hours             0-23                          , - * /
#     Day-of-month      1-31                          , - * ? / L W C
#     Month             1-12 or JAN-DEC               , - * /
#     Day-of-Week        1-7 or SUN-SAT               , - * ? / L C #
#     Year (Optional)  empty, 1970-2099               , - * /
#

# --- Import jobs -----------------------------------------
# SAP Data (BP, Mat, Conditions and Vendor): Import from staging area into DB.
sapimport.cron_expression=15 * * * * ?

# SBB stores the files every 10 minutes from 0, sometimes a minute later.
# To consume messages both in Quality + Prod system (to testing production-identical rail-orders):
# Q: 5 2/10 * * * ?  (but not delete the files)
# P: 5 3/10 * * * ?  (deletes the files)
edifact_import.cron_expression=5 3/10 * * * ?

# wagon_event_proc processes the data inserted by edifact_import. Q+P can run at the same time for this job.
wagon_event_proc.cron_expression=35 3/10 * * * ?

# --- Cleanup + Bookkeeping Jobs --------------------------
# Cleanup of tlgnc_log, but also tlgnc_mopevent_header/data_in/out
sapimport_clean_log.cron_expression=45 0 * * * ?

# PDA session timeout is on 720 min at Holcim.... Therefore, running this every 5 min is enough.
pda_session_reaper.cron_expression=30 0/5 * * * ?

# There seems to be some db-env issues around midnight (ADN49048). Therefore, better run this as 1.
rfid_object_label_cleanup.cron_expression=0 0 1 * * ?

# Delivery note cleanup job
delivnote_cleanup.cron_expression=0 0 1-5 * * ?

# Send orders to SAP/set orders to finished/send credit notes every 10 minutes
update_orders.cron_expression=5 1/10 * * * ?

# Send emails with daily reports
# 23:59:00
send_daily_reports.cron_expression=0 59 23 * * ?
# 00:01:00 / 00:02:00 / 00:03:00
send_staging_area_report_vn.cron_expression=0 1 0 * * ?
send_staging_area_report_mn.cron_expression=0 2 0 * * ?
send_staging_area_report_bpn.cron_expression=0 3 0 * * ?

postprocess_sapimport_vehn.cron_expression=0 0/5 * * * ?

update_planning_mat_sarea.cron_expression=59 59 23 31 12 ? 2099

# filter for old (1year+) finshed/deleted orders and send them to the archiving system +remove from db
archive_orders.cron_expression=0 15 1 * * ?

# Enable (true) or disable (false) servlet filter which inserts HttpOnly flag to cookie.
# JBoss 4.2 is not support this fetautre default.
use_HttpOnly_SessionIdFilter=true
# Servlet filter inserts Secure flag on HTTPS usage (only servlet filter is on).
use_HttpOnly_Secure_SessionIdFilter=false

# Note: when modifying this file, please check etc/logon-nightly as well.
