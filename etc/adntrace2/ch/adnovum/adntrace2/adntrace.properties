# these are the classes needed for logging facilities to operate.
logger.class.import.1=ch.nevis.jcan.log.JcanLogger
logger.class.import.2=ch.nevis.jcan.log.JcanLoggerFactory

# you might also want to import in bulk. (the per-class import and package options are mutually exclusive)
logger.package.import=ch.nevis.jcan.log.*

# name of the Logger variable used in the declaration and production of code.
logger.var.name=LOG
logger.var.type=JcanLogger
logger.factory.type=JcanLoggerFactory
