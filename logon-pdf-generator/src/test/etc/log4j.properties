# this is the default log4j.properties which is included in the jarfile
# to override it, use sth like this in your build.xml:
#    <jvmarg value="-Dlog4j.configuration=file:///${test.etc.dir}/log4j.properties"/>
#
log4j.rootLogger=DEBUG, stdout

# appenders
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss,SSS} %-5.5p [%12.12C{1}:%-4.5L] %x%m%n

log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=logon-pdf-generator-test.log
log4j.appender.FILE.MaxFileSize=10000KB
log4j.appender.FILE.MaxBackupIndex=3
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{HH:mm:ss,SSS} %-5.5p [%20.20C{1}:%-4.5L] %x%m%n

log4j.logger.com.crh.logon.business.services.pdftools=INFO
log4j.logger.com.crh.logon.pdf=INFO

