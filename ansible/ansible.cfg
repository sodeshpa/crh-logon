[defaults]
host_key_checking = False
ansible_managed = Ansible managed: The file will be overwritten during every ansible deployment!
log_path = ./ansible.log

# disable retry files, usually we do *not* use them anyway and the
# pollute the checkout directory
retry_files_enabled = False

# This is necessary to enable proper sudo execution on the remote host
# we need to run yum commands as root, it seems that running them with the sudo
# prefix does not work.
# Details can be found here: https://aww.adnovum.ch/jira/browse/ADNNB-3170
remote_tmp = /tmp

# Callback plugin configuration
stdout_callback = debug

