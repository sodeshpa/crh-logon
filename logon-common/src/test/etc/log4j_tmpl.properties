# root logger
log4j.rootLogger=DEBUG, stdout, FILE

# appenders
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss,SSS} %-5.5p [%20.20C{1}:%-4.5L] %x%m%n

log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=@logpath@/Test.log
log4j.appender.FILE.MaxFileSize=1000KB
log4j.appender.FILE.MaxBackupIndex=3
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{HH:mm:ss,SSS} %-5.5p [%20.20C{1}:%-4.5L] %x%m%n

# application
log4j.logger.com.crh.logon=INFO
log4j.logger.org.openqa.selenium.server=INFO
log4j.logger.org.openqa.selenium.server.SeleniumDriverResourceHandler=ERROR

